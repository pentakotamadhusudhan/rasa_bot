<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medicas Chatbot</title>
</head>
<body>

  <h1>Welcome to Medicas Support</h1>
  <div id="webchat"></div>

  <script src="https://cdn.jsdelivr.net/npm/@rasahq/rasa-webchat@1.0.1/lib/index.min.js"></script>
  <script>
    WebChat.default.init({
      selector: "#webchat",
      initPayload: "/greet",
      customData: { language: "en" }, // optional
      socketUrl: "http://192.168.1.13:5005",
      socketPath: "/socket.io/",
      title: "Medicas Support",
      subtitle: "How can we help you?",
      inputTextFieldHint: "Type your message...",
      showFullScreenButton: true,
      profileAvatar: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
      openLauncherImage: "https://cdn-icons-png.flaticon.com/512/561/561127.png",
      closeLauncherImage: "https://cdn-icons-png.flaticon.com/512/1828/1828665.png",
      params: {
        storage: "session"
      }
    });
  </script>

</body>
</html>

version: "3.1"

stories:
- story: user greets and provides issue
  steps:
  - intent: greet
  - action: utter_greet
  - intent: provide_issue
  - action: action_handle_issue

- story: user asks for status
  steps:
  - intent: ask_status
  - action: utter_provide_status

- story: goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- story: thanks
  steps:
  - intent: thanks
  - action: utter_thanks






- story: unable to book appointment
  steps:
    - intent: unable_to_book_appointment
    - action: utter_unable_to_book_appointment
    - action: utter_ask_email
    - action: action_send_email
    - intent: thanks
    - action: utter_thank_you


- story: issue_doctor_absent
  steps: 
    - intent: issue_doctor_absent
    - action: utter_ask_appointment_id
    - intent: thanks
    - action: utter_thank_you

